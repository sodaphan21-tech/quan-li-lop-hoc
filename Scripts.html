<script>
(function () {
  'use strict';

  var state = { view: 'dashboard', bootstrap: null, students: [], assignments: [], announcements: [], attendance: null, submissions: null };
  var titles = { dashboard: 'Tổng quan', students: 'Học sinh', assignments: 'Bài tập', submissions: 'Bài nộp', attendance: 'Điểm danh', announcements: 'Thông báo' };
  var icons = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-6h-4v6H4a1 1 0 0 1-1-1z"/></svg>',
    users: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20M8 7h8M8 10h7"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>',
    bell: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></svg>'
  };

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function callServer(name, args) {
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (error) {
        reject(new Error(error && error.message ? error.message : String(error)));
      });
      runner[name].apply(runner, args || []);
    });
  }
  function toast(message, type) {
    var stack = document.getElementById('toastStack');
    var item = document.createElement('div');
    item.className = 'toast ' + (type || '');
    item.textContent = message;
    stack.appendChild(item);
    window.setTimeout(function () { item.remove(); }, 4200);
  }
  function loading(message) {
    document.getElementById('pageContent').innerHTML = '<div class="loading-state"><span class="spinner"></span>' + esc(message || 'Đang tải dữ liệu…') + '</div>';
  }
  function errorPage(error) {
    document.getElementById('pageContent').innerHTML = '<div class="panel"><div class="table-empty"><strong>Chưa tải được dữ liệu</strong><span>' + esc(error.message || 'Có lỗi xảy ra.') + '</span><br><br><button class="button button-quiet button-small" data-action="retry">Thử lại</button></div></div>';
  }
  function dateLabel(value) {
    if (!value) return '—';
    var parts = String(value).slice(0, 10).split('-');
    return parts.length === 3 ? parts[2] + '/' + parts[1] + '/' + parts[0] : esc(value);
  }
  function statusClass(value) {
    var v = normalize(value);
    if (/dang hoc|co mat|da nop|dang giao|dang hieu luc/.test(v)) return 'status-active';
    if (/ngung|vang|het han|da dong|nop tre/.test(v)) return 'status-inactive';
    if (/chua nop|nhap|co phep/.test(v)) return 'status-pending';
    return 'status-muted';
  }
  function normalize(value) {
    return String(value || '').toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
  }
  function pill(value) {
    return '<span class="status-pill ' + statusClass(value) + '">' + esc(value || 'Chưa cập nhật') + '</span>';
  }
  function emptyTable(title, detail) {
    return '<div class="table-empty"><strong>' + esc(title) + '</strong><span>' + esc(detail || 'Thêm dữ liệu để bắt đầu quản lí.') + '</span></div>';
  }
  function optionList(values, selected, includeBlank) {
    var html = includeBlank ? '<option value="">— Chọn —</option>' : '';
    (values || []).forEach(function (value) {
      html += '<option value="' + esc(value) + '"' + (String(value) === String(selected) ? ' selected' : '') + '>' + esc(value) + '</option>';
    });
    return html;
  }
  function lookup(group) {
    return state.bootstrap && state.bootstrap.lookups && state.bootstrap.lookups[group] || [];
  }
  function initials(name) {
    return String(name || '?').trim().split(/\s+/).slice(-2).map(function (part) { return part.charAt(0); }).join('').toLocaleUpperCase('vi');
  }
  function setHeader() {
    document.getElementById('pageTitle').textContent = titles[state.view];
    document.getElementById('breadcrumbCurrent').textContent = titles[state.view];
    document.querySelectorAll('.nav-item').forEach(function (button) {
      button.classList.toggle('active', button.dataset.view === state.view);
    });
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('mobileScrim').classList.remove('show');
  }
  function loadBootstrap() {
    loading('Đang kết nối với bảng tính…');
    callServer('getBootstrap').then(function (data) {
      state.bootstrap = data;
      document.getElementById('className').textContent = data.className || 'Lớp học';
      document.getElementById('classAvatar').textContent = initials(data.className || 'Lớp');
      document.getElementById('teacherName').textContent = data.teacherName || 'Giáo viên';
      document.getElementById('todayLabel').textContent = dateLabel(data.today);
      setHeader();
      renderDashboard(data);
    }).catch(errorPage);
  }
  function navigate(view) {
    if (!titles[view]) return;
    state.view = view;
    setHeader();
    closeSidebar();
    loading('Đang tải ' + titles[view].toLocaleLowerCase('vi') + '…');

    var task;
    if (view === 'dashboard') task = callServer('getBootstrap').then(function (data) { state.bootstrap = data; renderDashboard(data); });
    if (view === 'students') task = callServer('getStudents').then(function (data) { state.students = data; renderStudents(); });
    if (view === 'assignments') task = callServer('getAssignments').then(function (data) { state.assignments = data; renderAssignments(); });
    if (view === 'submissions') task = callServer('getAssignments').then(function (data) { state.assignments = data; renderSubmissions(); });
    if (view === 'attendance') task = callServer('getAttendanceData').then(function (data) { state.attendance = data; renderAttendance(); });
    if (view === 'announcements') task = callServer('getAnnouncements').then(function (data) { state.announcements = data; renderAnnouncements(); });
    if (task) task.catch(errorPage);
  }

  function renderDashboard(data) {
    var m = data.summary || {};
    var upcoming = data.upcomingAssignments || [];
    var announcements = data.recentAnnouncements || [];
    document.getElementById('pageContent').innerHTML =
      '<div class="page-intro"><div><h2>Chào buổi học mới' + (data.teacherName ? ', ' + esc(data.teacherName) : '') + '</h2><p>Tình hình lớp học được cập nhật từ dữ liệu trong bảng tính.</p></div><button class="button button-primary" data-action="quick-student">＋ Thêm học sinh</button></div>' +
      '<div class="metrics-grid">' +
        metric('Học sinh đang học', m.students || 0, 'Trong danh sách lớp', 'users', 'purple') +
        metric('Bài tập đang giao', m.assignments || 0, 'Cần theo dõi hạn nộp', 'book', 'blue') +
        metric('Thông báo hiệu lực', m.announcements || 0, 'Đang hiển thị trong lớp', 'bell', 'teal') +
        metric('Buổi điểm danh', m.attendanceSessions || 0, 'Tổng số buổi đã ghi', 'calendar', 'amber') +
      '</div>' +
      '<div class="dashboard-grid">' +
        '<section class="panel"><div class="panel-header"><div><h3>Bài tập cần theo dõi</h3><p>Các hạn nộp gần nhất</p></div><button class="panel-link" data-view-link="assignments">Xem bài tập →</button></div><div class="panel-body">' + assignmentFeed(upcoming) + '</div></section>' +
        '<section class="panel"><div class="panel-header"><div><h3>Thông báo mới</h3><p>Tin đang có hiệu lực</p></div><button class="panel-link" data-view-link="announcements">Xem tất cả →</button></div><div class="panel-body">' + announcementFeed(announcements) + '</div></section>' +
      '</div>';
  }
  function metric(label, value, foot, iconName, color) {
    var iconMap = { users: '♙', book: '▤', bell: '♧', calendar: '▦' };
    return '<article class="metric-card"><div class="metric-top"><span class="metric-label">' + esc(label) + '</span><span class="metric-icon ' + color + '">' + iconMap[iconName] + '</span></div><div class="metric-value">' + esc(value) + '</div><div class="metric-foot">' + esc(foot) + '</div></article>';
  }
  function assignmentFeed(rows) {
    if (!rows.length) return emptyTable('Chưa có bài tập đang giao', 'Các bài tập sắp tới sẽ xuất hiện ở đây.');
    return rows.map(function (row) {
      return '<div class="list-row"><span class="list-dot"></span><div class="list-row-main"><strong>' + esc(row.TieuDe) + '</strong><small>' + esc(row.MonHoc || 'Chưa phân môn') + (row.DoiTuongNhan ? ' · ' + esc(row.DoiTuongNhan) : '') + '</small></div><div class="list-row-side">Hạn ' + dateLabel(row.HanNop) + '</div></div>';
    }).join('');
  }
  function announcementFeed(rows) {
    if (!rows.length) return emptyTable('Chưa có thông báo hiệu lực', 'Thông báo đang hoạt động sẽ xuất hiện ở đây.');
    return rows.map(function (row) {
      return '<div class="list-row"><span class="list-dot teal"></span><div class="list-row-main"><strong>' + esc(row.TieuDe) + '</strong><small>' + esc(row.DoiTuongNhan || 'Cả lớp') + ' · đăng ' + dateLabel(row.NgayDang) + '</small></div><div class="list-row-side">' + (row.NgayHetHan ? 'Đến ' + dateLabel(row.NgayHetHan) : 'Không hạn') + '</div></div>';
    }).join('');
  }

  function renderStudents() {
    var rows = state.students || [];
    document.getElementById('pageContent').innerHTML =
      '<div class="page-intro"><div><h2>Danh sách học sinh</h2><p>Thêm, tìm kiếm và cập nhật tình trạng học sinh trong lớp.</p></div><button class="button button-primary" data-action="add-student">＋ Thêm học sinh</button></div>' +
      '<div class="toolbar"><div class="search-box"><input id="studentSearch" type="search" placeholder="Tìm theo tên, mã hoặc lớp…" aria-label="Tìm học sinh"></div><select id="studentStatusFilter" class="filter-select"><option value="">Tất cả trạng thái</option>' + optionList(lookup('STUDENT_STATUS').map(function (x) { return x.label; }), '', false) + '</select><div class="toolbar-spacer"></div><span class="date-small">Tổng: ' + rows.length + ' học sinh</span></div>' +
      '<section class="panel table-panel"><div class="table-scroll"><table><thead><tr><th>Học sinh</th><th>Lớp</th><th>Trạng thái</th><th>Ghi chú</th><th></th></tr></thead><tbody id="studentRows"></tbody></table></div></section>';
    renderStudentRows();
    document.getElementById('studentSearch').addEventListener('input', renderStudentRows);
    document.getElementById('studentStatusFilter').addEventListener('change', renderStudentRows);
  }
  function renderStudentRows() {
    var query = normalize(document.getElementById('studentSearch').value);
    var status = document.getElementById('studentStatusFilter').value;
    var rows = state.students.filter(function (row) {
      var text = normalize([row.MaHS, row.HoTen, row.Lop, row.GhiChu].join(' '));
      return (!query || text.indexOf(query) >= 0) && (!status || row.TrangThai === status);
    });
    var body = document.getElementById('studentRows');
    body.innerHTML = rows.length ? rows.map(function (row) {
      return '<tr><td><div class="student-cell"><span class="student-initial">' + esc(initials(row.HoTen)) + '</span><div><span class="student-name">' + esc(row.HoTen) + '</span><span class="student-code">' + esc(row.MaHS) + '</span></div></div></td><td>' + esc(row.Lop || '—') + '</td><td>' + pill(row.TrangThai) + '</td><td>' + esc(row.GhiChu || '—') + '</td><td><div class="row-actions"><button class="icon-action" title="Sửa học sinh" aria-label="Sửa học sinh" data-action="edit-student" data-id="' + esc(row.MaHS) + '">' + icons.edit + '</button></div></td></tr>';
    }).join('') : '<tr><td colspan="5">' + emptyTable('Không có học sinh phù hợp', 'Thử thay đổi từ khóa hoặc bộ lọc.') + '</td></tr>';
  }

  function renderAssignments() {
    var rows = state.assignments || [];
    document.getElementById('pageContent').innerHTML =
      '<div class="page-intro"><div><h2>Quản lí bài tập</h2><p>Tạo bài tập, đặt hạn nộp và theo dõi nhóm học sinh nhận bài.</p></div><button class="button button-primary" data-action="add-assignment">＋ Tạo bài tập</button></div>' +
      '<div class="toolbar"><div class="search-box"><input id="assignmentSearch" type="search" placeholder="Tìm tên bài hoặc môn học…" aria-label="Tìm bài tập"></div><select id="assignmentStatusFilter" class="filter-select"><option value="">Tất cả trạng thái</option>' + optionList(lookup('ASSIGNMENT_STATUS').map(function (x) { return x.label; }), '', false) + '</select><div class="toolbar-spacer"></div><span class="date-small">Tổng: ' + rows.length + ' bài tập</span></div>' +
      '<section class="panel table-panel"><div class="table-scroll"><table><thead><tr><th>Bài tập</th><th>Ngày giao</th><th>Hạn nộp</th><th>Đối tượng</th><th>Trạng thái</th><th></th></tr></thead><tbody id="assignmentRows"></tbody></table></div></section>';
    renderAssignmentRows();
    document.getElementById('assignmentSearch').addEventListener('input', renderAssignmentRows);
    document.getElementById('assignmentStatusFilter').addEventListener('change', renderAssignmentRows);
  }
  function renderAssignmentRows() {
    var query = normalize(document.getElementById('assignmentSearch').value);
    var status = document.getElementById('assignmentStatusFilter').value;
    var rows = state.assignments.filter(function (row) {
      return (!query || normalize([row.TieuDe, row.MonHoc, row.YeuCau].join(' ')).indexOf(query) >= 0) &&
        (!status || row.TrangThai === status);
    });
    document.getElementById('assignmentRows').innerHTML = rows.length ? rows.map(function (row) {
      return '<tr><td><div class="assignment-title">' + esc(row.TieuDe) + '</div><span class="student-code">' + esc(row.MonHoc || 'Chưa phân môn') + '</span></td><td>' + dateLabel(row.NgayGiao) + '</td><td>' + dateLabel(row.HanNop) + '</td><td>' + esc(row.DoiTuongNhan || '—') + '</td><td>' + pill(row.TrangThai) + '</td><td><div class="row-actions"><button class="icon-action" title="Sửa bài tập" aria-label="Sửa bài tập" data-action="edit-assignment" data-id="' + esc(row.MaBai) + '">' + icons.edit + '</button></div></td></tr>';
    }).join('') : '<tr><td colspan="6">' + emptyTable('Chưa có bài tập', 'Tạo bài tập đầu tiên để theo dõi tiến độ nộp.') + '</td></tr>';
  }

  function renderSubmissions(selectedId) {
    var assignments = state.assignments || [];
    var selected = selectedId || document.getElementById('submissionAssignment') && document.getElementById('submissionAssignment').value || '';
    var assignmentOptions = '<option value="">— Chọn bài tập —</option>' + assignments.map(function (row) {
      return '<option value="' + esc(row.MaBai) + '">' + esc(row.TieuDe + (row.MonHoc ? ' · ' + row.MonHoc : '')) + '</option>';
    }).join('');
    document.getElementById('pageContent').innerHTML =
      '<div class="page-intro"><div><h2>Theo dõi bài nộp</h2><p>Cập nhật tình trạng, liên kết bài làm và nhận xét theo từng học sinh.</p></div></div>' +
      '<div class="toolbar"><div class="submission-select-wrap"><label for="submissionAssignment">Bài tập</label><select id="submissionAssignment">' + assignmentOptions + '</select></div><div class="toolbar-spacer"></div></div>' +
      '<section class="panel table-panel"><div id="submissionContent">' + (assignments.length ? emptyTable('Chọn bài tập', 'Chọn một bài tập phía trên để xem tình trạng nộp.') : emptyTable('Chưa có bài tập', 'Hãy tạo bài tập trước khi theo dõi bài nộp.')) + '</div></section>';
    var select = document.getElementById('submissionAssignment');
    if (select) {
      select.value = selected;
      select.addEventListener('change', function () { loadSubmissions(select.value); });
      if (selected) loadSubmissions(selected);
    }
  }
  function loadSubmissions(assignmentId) {
    if (!assignmentId) return;
    document.getElementById('submissionContent').innerHTML = '<div class="loading-state"><span class="spinner"></span>Đang tải bài nộp…</div>';
    callServer('getSubmissions', [assignmentId]).then(function (data) {
      state.submissions = data;
      var rows = data.rows || [];
      var statuses = data.statuses || [];
      document.getElementById('submissionContent').innerHTML = rows.length ?
        '<div class="table-scroll"><table class="submission-table"><thead><tr><th>Học sinh</th><th>Trạng thái</th><th>Thời gian nộp</th><th>Liên kết bài làm</th><th>Nhận xét</th><th></th></tr></thead><tbody>' +
          rows.map(function (row) {
            return '<tr data-student-id="' + esc(row.MaHS) + '"><td><div class="student-name">' + esc(row.HoTen) + '</div><span class="student-code">' + esc(row.MaHS) + '</span></td><td><select data-field="TrangThai">' + optionList(statuses, row.TrangThai, false) + '</select></td><td><input data-field="ThoiGianNop" type="datetime-local" value="' + esc(String(row.ThoiGianNop || '').replace(' ', 'T')) + '"></td><td><input data-field="LinkBaiNop" type="url" placeholder="https://…" value="' + esc(row.LinkBaiNop) + '"></td><td><input data-field="NhanXet" type="text" placeholder="Nhận xét ngắn" value="' + esc(row.NhanXet) + '"></td><td><button class="button button-quiet button-small" data-action="save-submission" data-id="' + esc(row.MaHS) + '">Lưu</button></td></tr>';
          }).join('') + '</tbody></table></div>' :
        emptyTable('Chưa có học sinh nhận bài', 'Kiểm tra đối tượng nhận trong thông tin bài tập.');
    }).catch(function (error) {
      document.getElementById('submissionContent').innerHTML = '<div class="table-empty"><strong>Không tải được bài nộp</strong><span>' + esc(error.message) + '</span></div>';
    });
  }

  function renderAttendance() {
    var data = state.attendance || { sessions: [], statuses: [] };
    var sessions = data.sessions || [];
    document.getElementById('pageContent').innerHTML =
      '<div class="page-intro"><div><h2>Sổ điểm danh</h2><p>Tạo buổi điểm danh và ghi nhận trạng thái từng học sinh.</p></div><button class="button button-primary" data-action="new-attendance">＋ Tạo buổi điểm danh</button></div>' +
      '<div class="notice-strip"><strong>' + ((data.students || []).length) + ' học sinh đang học</strong> · Khi tạo buổi mới, trạng thái ban đầu được đặt là "' + esc((data.statuses || [])[0] || 'Có mặt') + '".</div>' +
      '<section class="panel table-panel"><div class="table-scroll"><table><thead><tr><th>Ngày</th><th>Buổi / nội dung</th><th>Ghi chú</th><th></th></tr></thead><tbody>' +
      (sessions.length ? sessions.map(function (row) {
        return '<tr><td>' + dateLabel(row.Ngay) + '</td><td><span class="assignment-title">' + esc(row.TietHoacNoiDung || 'Buổi học') + '</span><span class="student-code">' + esc(row.MaBuoi) + '</span></td><td>' + esc(row.GhiChu || '—') + '</td><td><div class="row-actions"><button class="button button-quiet button-small" data-action="edit-attendance" data-id="' + esc(row.MaBuoi) + '">Mở điểm danh</button></div></td></tr>';
      }).join('') : '<tr><td colspan="4">' + emptyTable('Chưa có buổi điểm danh', 'Tạo buổi đầu tiên để ghi nhận sĩ số.') + '</td></tr>') +
      '</tbody></table></div></section>';
  }

  function renderAnnouncements() {
    var rows = state.announcements || [];
    document.getElementById('pageContent').innerHTML =
      '<div class="page-intro"><div><h2>Thông báo lớp học</h2><p>Soạn thông báo, chọn người nhận và đặt ngày hết hạn.</p></div><button class="button button-primary" data-action="add-announcement">＋ Tạo thông báo</button></div>' +
      '<div class="toolbar"><div class="search-box"><input id="announcementSearch" type="search" placeholder="Tìm tiêu đề hoặc nội dung…" aria-label="Tìm thông báo"></div><select id="announcementStatusFilter" class="filter-select"><option value="">Tất cả trạng thái</option>' + optionList(lookup('ANNOUNCEMENT_STATUS').map(function (x) { return x.label; }), '', false) + '</select><div class="toolbar-spacer"></div><span class="date-small">Tổng: ' + rows.length + ' thông báo</span></div>' +
      '<section class="panel table-panel"><div class="table-scroll"><table><thead><tr><th>Thông báo</th><th>Người nhận</th><th>Ngày đăng</th><th>Hết hạn</th><th>Trạng thái</th><th></th></tr></thead><tbody id="announcementRows"></tbody></table></div></section>';
    renderAnnouncementRows();
    document.getElementById('announcementSearch').addEventListener('input', renderAnnouncementRows);
    document.getElementById('announcementStatusFilter').addEventListener('change', renderAnnouncementRows);
  }
  function renderAnnouncementRows() {
    var query = normalize(document.getElementById('announcementSearch').value);
    var status = document.getElementById('announcementStatusFilter').value;
    var rows = state.announcements.filter(function (row) {
      return (!query || normalize([row.TieuDe, row.NoiDung].join(' ')).indexOf(query) >= 0) &&
        (!status || row.TrangThai === status);
    });
    document.getElementById('announcementRows').innerHTML = rows.length ? rows.map(function (row) {
      return '<tr><td><span class="assignment-title">' + esc(row.TieuDe) + '</span><span class="student-code">' + esc(String(row.NoiDung || '').slice(0, 85)) + (String(row.NoiDung || '').length > 85 ? '…' : '') + '</span></td><td>' + esc(row.DoiTuongNhan || '—') + '</td><td>' + dateLabel(row.NgayDang) + '</td><td>' + dateLabel(row.NgayHetHan) + '</td><td>' + pill(row.TrangThai) + '</td><td><div class="row-actions"><button class="icon-action" title="Sửa thông báo" aria-label="Sửa thông báo" data-action="edit-announcement" data-id="' + esc(row.MaThongBao) + '">' + icons.edit + '</button></div></td></tr>';
    }).join('') : '<tr><td colspan="6">' + emptyTable('Chưa có thông báo phù hợp', 'Tạo thông báo mới hoặc thay đổi bộ lọc.') + '</td></tr>';
  }

  function openModal(title, subtitle, body, submitLabel, wide) {
    document.getElementById('modalRoot').innerHTML =
      '<div class="modal-backdrop" data-action="backdrop-close"><section class="modal-card ' + (wide ? 'modal-wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modalTitle">' +
      '<div class="modal-header"><div><h3 id="modalTitle">' + esc(title) + '</h3><p>' + esc(subtitle || '') + '</p></div><button class="modal-close" data-action="close-modal" type="button" aria-label="Đóng">×</button></div>' +
      '<div class="modal-body">' + body + '</div>' +
      '<div class="modal-footer"><button class="button button-quiet" type="button" data-action="close-modal">Hủy</button>' +
      (submitLabel ? '<button class="button button-primary" type="submit" form="activeForm">' + esc(submitLabel) + '</button>' : '') + '</div></section></div>';
  }
  function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
  function field(label, name, value, type, required, hint, full) {
    var fieldClass = 'field' + (full ? ' field-full' : '');
    var input = type === 'textarea' ?
      '<textarea name="' + esc(name) + '" ' + (required ? 'required' : '') + '>' + esc(value || '') + '</textarea>' :
      '<input name="' + esc(name) + '" type="' + esc(type || 'text') + '" value="' + esc(value || '') + '" ' + (required ? 'required' : '') + '>';
    return '<div class="' + fieldClass + '"><label>' + esc(label) + (required ? ' *' : '') + '</label>' + input + (hint ? '<small>' + esc(hint) + '</small>' : '') + '</div>';
  }
  function selectField(label, name, options, value, required, full) {
    return '<div class="field' + (full ? ' field-full' : '') + '"><label>' + esc(label) + (required ? ' *' : '') + '</label><select name="' + esc(name) + '" ' + (required ? 'required' : '') + '>' + optionList(options, value, !required) + '</select></div>';
  }
  function formShell(action, hiddenId, contents) {
    return '<form id="activeForm" data-form="' + action + '">' + (hiddenId ? '<input type="hidden" name="Ma' + hiddenId[0] + '" value="' + esc(hiddenId[1]) + '">' : '') + contents + '</form>';
  }
  function openStudentForm(record) {
    var row = record || {};
    var body = formShell('student', row.MaHS ? ['HS', row.MaHS] : null,
      '<div class="form-grid">' +
      field('Họ và tên', 'HoTen', row.HoTen, 'text', true, '', true) +
      field('Lớp', 'Lop', row.Lop || (state.bootstrap && state.bootstrap.className), 'text', true) +
      selectField('Trạng thái', 'TrangThai', lookup('STUDENT_STATUS').map(function (x) { return x.label; }), row.TrangThai || lookup('STUDENT_STATUS')[0] && lookup('STUDENT_STATUS')[0].label, true) +
      field('Ghi chú', 'GhiChu', row.GhiChu, 'textarea', false, '', true) +
      '</div>');
    openModal(row.MaHS ? 'Cập nhật học sinh' : 'Thêm học sinh', 'Thông tin được lưu trong sheet HocSinh.', body, row.MaHS ? 'Lưu thay đổi' : 'Thêm học sinh', false);
  }
  function openAssignmentForm(record) {
    var row = record || {};
    var body = formShell('assignment', row.MaBai ? ['Bai', row.MaBai] : null,
      '<div class="form-grid">' +
      field('Tiêu đề', 'TieuDe', row.TieuDe, 'text', true, '', true) +
      field('Môn học', 'MonHoc', row.MonHoc, 'text', false) +
      field('Ngày giao', 'NgayGiao', row.NgayGiao || (state.bootstrap && state.bootstrap.today), 'date', false) +
      field('Hạn nộp', 'HanNop', row.HanNop, 'date', false) +
      field('Yêu cầu', 'YeuCau', row.YeuCau, 'textarea', false, '', true) +
      selectField('Đối tượng nhận', 'DoiTuongNhan', lookup('RECIPIENT_TYPE').map(function (x) { return x.label; }), row.DoiTuongNhan || lookup('RECIPIENT_TYPE')[0] && lookup('RECIPIENT_TYPE')[0].label, true) +
      field('Mã học sinh nhận bài', 'DanhSachMaHS', row.DanhSachMaHS, 'text', false, 'Chỉ dùng khi chọn nhóm học sinh. Có thể phân cách bằng dấu phẩy.') +
      selectField('Cách nộp', 'CachNop', lookup('SUBMISSION_METHOD').map(function (x) { return x.label; }), row.CachNop, false) +
      field('Liên kết tài liệu', 'LinkTaiLieu', row.LinkTaiLieu, 'url', false, 'Nhập đường liên kết bắt đầu bằng https://', true) +
      field('Drive File ID', 'DriveFileId', row.DriveFileId, 'text', false) +
      selectField('Trạng thái', 'TrangThai', lookup('ASSIGNMENT_STATUS').map(function (x) { return x.label; }), row.TrangThai || lookup('ASSIGNMENT_STATUS')[0] && lookup('ASSIGNMENT_STATUS')[0].label, true) +
      field('Ghi chú', 'GhiChu', row.GhiChu, 'text', false) +
      '</div>');
    openModal(row.MaBai ? 'Cập nhật bài tập' : 'Tạo bài tập', 'Điền thông tin và lưu vào sheet BaiTap.', body, row.MaBai ? 'Lưu thay đổi' : 'Tạo bài tập', true);
  }
  function openAnnouncementForm(record) {
    var row = record || {};
    var body = formShell('announcement', row.MaThongBao ? ['ThongBao', row.MaThongBao] : null,
      '<div class="form-grid">' +
      field('Tiêu đề', 'TieuDe', row.TieuDe, 'text', true, '', true) +
      field('Nội dung', 'NoiDung', row.NoiDung, 'textarea', true, '', true) +
      selectField('Đối tượng nhận', 'DoiTuongNhan', lookup('RECIPIENT_TYPE').map(function (x) { return x.label; }), row.DoiTuongNhan || lookup('RECIPIENT_TYPE')[0] && lookup('RECIPIENT_TYPE')[0].label, true) +
      field('Mã học sinh nhận', 'DanhSachMaHS', row.DanhSachMaHS, 'text', false, 'Chỉ dùng cho nhóm học sinh.') +
      field('Ngày đăng', 'NgayDang', row.NgayDang || (state.bootstrap && state.bootstrap.today), 'date', false) +
      field('Ngày hết hạn', 'NgayHetHan', row.NgayHetHan, 'date', false) +
      selectField('Trạng thái', 'TrangThai', lookup('ANNOUNCEMENT_STATUS').map(function (x) { return x.label; }), row.TrangThai || lookup('ANNOUNCEMENT_STATUS')[0] && lookup('ANNOUNCEMENT_STATUS')[0].label, true) +
      field('Ghi chú', 'GhiChu', row.GhiChu, 'text', false) +
      '</div>');
    openModal(row.MaThongBao ? 'Cập nhật thông báo' : 'Tạo thông báo', 'Chọn thời gian hiển thị và nhóm nhận phù hợp.', body, row.MaThongBao ? 'Lưu thay đổi' : 'Đăng thông báo', true);
  }

  function openAttendanceEditor(session, existingRows, statuses) {
    var students = existingRows || (state.attendance && state.attendance.students || []).map(function (student) {
      return { MaHS: student.MaHS, HoTen: student.HoTen, TrangThai: statuses[0] || 'Có mặt', GhiChu: '' };
    });
    var sessionRow = session || {};
    var body = '<form id="activeForm" data-form="attendance">' +
      '<input type="hidden" name="MaBuoi" value="' + esc(sessionRow.MaBuoi || '') + '">' +
      '<div class="form-grid">' +
      field('Ngày điểm danh', 'Ngay', sessionRow.Ngay || (state.bootstrap && state.bootstrap.today), 'date', true) +
      field('Buổi / tiết / nội dung', 'TietHoacNoiDung', sessionRow.TietHoacNoiDung, 'text', false) +
      field('Ghi chú buổi học', 'GhiChu', sessionRow.GhiChu, 'text', false, '', true) +
      '</div><div class="helper-note">Chọn trạng thái cho từng học sinh. Ghi chú riêng có thể nhập ở cột cuối.</div>' +
      '<div class="table-scroll"><table class="attendance-table"><thead><tr><th>Học sinh</th><th>Trạng thái</th><th>Ghi chú</th></tr></thead><tbody>' +
      students.map(function (row) {
        return '<tr data-student-id="' + esc(row.MaHS) + '"><td><span class="student-name">' + esc(row.HoTen) + '</span><span class="student-code">' + esc(row.MaHS) + '</span></td><td><select data-field="TrangThai">' + optionList(statuses, row.TrangThai || statuses[0], false) + '</select></td><td><input data-field="GhiChu" type="text" placeholder="Ghi chú" value="' + esc(row.GhiChu) + '"></td></tr>';
      }).join('') + '</tbody></table></div></form>';
    openModal(sessionRow.MaBuoi ? 'Cập nhật điểm danh' : 'Tạo buổi điểm danh', 'Buổi điểm danh và chi tiết sẽ được lưu vào hai sheet riêng.', body, 'Lưu điểm danh', true);
  }

  function formObject(form) {
    var result = {};
    new FormData(form).forEach(function (value, key) { result[key] = value; });
    return result;
  }
  function submitForm(form) {
    var action = form.dataset.form;
    var data = formObject(form);
    var method = action === 'student' ? 'saveStudent' :
      action === 'assignment' ? 'saveAssignment' :
      action === 'announcement' ? 'saveAnnouncement' : '';
    if (action === 'attendance') {
      data.records = Array.prototype.slice.call(form.querySelectorAll('tbody tr[data-student-id]')).map(function (row) {
        return {
          MaHS: row.dataset.studentId,
          TrangThai: row.querySelector('[data-field="TrangThai"]').value,
          GhiChu: row.querySelector('[data-field="GhiChu"]').value
        };
      });
      method = 'saveAttendanceSession';
    }
    if (!method) return;
    var submit = document.querySelector('.modal-footer button[type="submit"]');
    if (submit) { submit.disabled = true; submit.textContent = 'Đang lưu…'; }
    callServer(method, [data]).then(function (result) {
      closeModal();
      toast(result.message || 'Đã lưu dữ liệu.', 'success');
      navigate(state.view);
    }).catch(function (error) {
      if (submit) { submit.disabled = false; submit.textContent = 'Thử lưu lại'; }
      toast(error.message || 'Không lưu được dữ liệu.', 'error');
    });
  }

  document.addEventListener('click', function (event) {
    var nav = event.target.closest('[data-view]');
    if (nav) { navigate(nav.dataset.view); return; }
    var viewLink = event.target.closest('[data-view-link]');
    if (viewLink) { navigate(viewLink.dataset.viewLink); return; }

    var button = event.target.closest('[data-action]');
    if (!button) return;
    var action = button.dataset.action;
    if (action === 'close-modal') { closeModal(); return; }
    if (action === 'backdrop-close' && event.target === button) { closeModal(); return; }
    if (action === 'retry') { navigate(state.view); return; }
    if (action === 'quick-student' || action === 'add-student') { openStudentForm(); return; }
    if (action === 'add-assignment') { openAssignmentForm(); return; }
    if (action === 'add-announcement') { openAnnouncementForm(); return; }
    if (action === 'edit-student') { openStudentForm(state.students.find(function (x) { return x.MaHS === button.dataset.id; })); return; }
    if (action === 'edit-assignment') { openAssignmentForm(state.assignments.find(function (x) { return x.MaBai === button.dataset.id; })); return; }
    if (action === 'edit-announcement') { openAnnouncementForm(state.announcements.find(function (x) { return x.MaThongBao === button.dataset.id; })); return; }
    if (action === 'new-attendance') {
      var statuses = state.attendance && state.attendance.statuses || [];
      openAttendanceEditor(null, null, statuses);
      return;
    }
    if (action === 'edit-attendance') {
      var sessionId = button.dataset.id;
      button.disabled = true;
      callServer('getAttendanceSession', [sessionId]).then(function (data) {
        openAttendanceEditor(data.session, data.rows, data.statuses);
      }).catch(function (error) { toast(error.message, 'error'); }).finally(function () { button.disabled = false; });
      return;
    }
    if (action === 'save-submission') {
      var row = button.closest('tr');
      var select = document.getElementById('submissionAssignment');
      button.disabled = true;
      callServer('saveSubmission', [{
        MaBai: select.value,
        MaHS: button.dataset.id,
        TrangThai: row.querySelector('[data-field="TrangThai"]').value,
        ThoiGianNop: row.querySelector('[data-field="ThoiGianNop"]').value.replace('T', ' '),
        LinkBaiNop: row.querySelector('[data-field="LinkBaiNop"]').value,
        NhanXet: row.querySelector('[data-field="NhanXet"]').value
      }]).then(function (result) {
        toast(result.message, 'success');
        button.disabled = false;
      }).catch(function (error) { toast(error.message, 'error'); button.disabled = false; });
      return;
    }
  });

  document.addEventListener('submit', function (event) {
    if (event.target.matches('#activeForm')) {
      event.preventDefault();
      submitForm(event.target);
    }
  });
  document.getElementById('refreshButton').addEventListener('click', function () { navigate(state.view); }); var themeToggle = document.getElementById('themeToggle');

themeToggle.addEventListener('click', function () {
  var isDark = document.documentElement.getAttribute('data-theme') !== 'dark';

  document.documentElement.setAttribute(
    'data-theme',
    isDark ? 'dark' : 'light'
  );

  document.getElementById('themeIcon').textContent = isDark ? '☀' : '☾';
  document.getElementById('themeLabel').textContent =
    isDark ? 'Giao diện sáng' : 'Giao diện tối';

  themeToggle.setAttribute(
    'aria-label',
    isDark ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối'
  );
});
  document.getElementById('menuToggle').addEventListener('click', function () {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('mobileScrim').classList.add('show');
  });
  document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
  document.getElementById('mobileScrim').addEventListener('click', closeSidebar);
  document.querySelectorAll('[data-icon]').forEach(function (node) { node.innerHTML = icons[node.dataset.icon] || ''; });

  loadBootstrap();
})();
</script>
