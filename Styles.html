html[data-theme="dark"] {
  color-scheme: dark;
  --ink: #e8ebf3;
  --muted: #a4aec0;
  --line: #394155;
  --panel: #20283a;
  --canvas: #151b28;
  --primary: #958cff;
  --primary-dark: #8177ff;
  --primary-soft: #302c52;
  --teal: #47c5a6;
  --teal-soft: #1e3d38;
  --amber: #f1bd57;
  --amber-soft: #3d321f;
  --red: #f17c8d;
  --red-soft: #442b32;
  --blue: #71b7ff;
  --blue-soft: #20374f;
  --shadow: 0 12px 34px rgba(0, 0, 0, .25);
}

html[data-theme="dark"] .sidebar,
html[data-theme="dark"] .date-chip,
html[data-theme="dark"] .button-quiet,
html[data-theme="dark"] .metric-card,
html[data-theme="dark"] .panel,
html[data-theme="dark"] .soft-card,
html[data-theme="dark"] .search-box input,
html[data-theme="dark"] .filter-select,
html[data-theme="dark"] .field input,
html[data-theme="dark"] .field select,
html[data-theme="dark"] .field textarea,
html[data-theme="dark"] .modal-card,
html[data-theme="dark"] .icon-action,
html[data-theme="dark"] .attendance-table select,
html[data-theme="dark"] .submission-table select,
html[data-theme="dark"] .submission-table input,
html[data-theme="dark"] .submission-select-wrap select {
  color: var(--ink);
  background: var(--panel);
  border-color: var(--line);
}

html[data-theme="dark"] .class-switcher,
html[data-theme="dark"] .nav-item:hover,
html[data-theme="dark"] .button-quiet:hover,
html[data-theme="dark"] .modal-close {
  color: var(--ink);
  background: #2a3347;
  border-color: var(--line);
}

html[data-theme="dark"] thead th {
  color: var(--muted);
  background: #252e42;
  border-color: var(--line);
}

html[data-theme="dark"] tbody td,
html[data-theme="dark"] .nav-item,
html[data-theme="dark"] .student-name,
html[data-theme="dark"] .field label {
  color: var(--ink);
  border-color: var(--line);
}

html[data-theme="dark"] tbody tr:hover {
  background: #252e42;
}

html[data-theme="dark"] .panel-header,
html[data-theme="dark"] .modal-header,
html[data-theme="dark"] .modal-footer,
html[data-theme="dark"] .list-row {
  border-color: var(--line);
}
